services:
  pawday:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawday
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/pawday.db
      UPLOAD_DIR: /uploads
      AUTH_TRUST_HOST: "true"
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
