services:
  pawday:
    image: ${PAWDAY_IMAGE:-pawday:1.0.0}
    container_name: pawday
    restart: unless-stopped
    init: true
    ports:
      - "${PAWDAY_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/data/pawday.db
      UPLOAD_DIR: /uploads
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env.nas 中设置 AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?请在 .env.nas 中设置 ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env.nas 中设置 ADMIN_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
